<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet" />

  <title>SLOOK | Modern Essentials</title>
  <meta name="description"
    content="SLOOK offers a curated collection of modern essentials, from premium apparel to everyday carry items. Elevate your style with substance." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://slook.store/" />
  <meta property="og:title" content="SLOOK | Modern Essentials" />
  <meta property="og:description"
    content="Discover SLOOK: A curated collection of modern essentials designed for longevity and style." />
  <meta property="og:image" content="https://slook.store/og-image.jpg" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://slook.store/" />
  <meta property="twitter:title" content="SLOOK | Modern Essentials" />
  <meta property="twitter:description"
    content="Discover SLOOK: A curated collection of modern essentials designed for longevity and style." />
  <meta property="twitter:image" content="https://slook.store/og-image.jpg" />

  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registered: ', reg))
          .catch(err => console.log('SW registration failed: ', err));
      });
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
